# PlasticSCM ignore.conf —— 团结云开发 / Plastic SCM 读取（UVCS 不认 .gitignore）
# 语法：前导斜杠 = 仅仓库根目录；无前导斜杠会按目录名全局匹配，会误伤 Assets 下同名目录。
# 因此 Builds / Logs / Build 一律带前导斜杠锚定根目录，Assets 下源码目录不被忽略。

# Unity 本地生成目录（根目录）
/Library/
/Temp/
/Obj/
/UserSettings/
/MemoryCaptures/
/Recordings/
/Build/
/Builds/
/Logs/

# IDE / 工程文件
.vs/
.vscode/
.idea/
*.csproj
*.unityproj
*.sln
*.suo
*.user
*.userprefs
*.pidb
*.booproj
*.svd
*.pdb
*.mdb
*.opendb
*.VC.db

# 系统文件
.DS_Store
Thumbs.db

# 打包产物（根目录）
/*.apk
/*.aab
/*.unitypackage

# 其他
sysinfo.txt
crashlytics-build.properties

# android-export 构建产物
/android-export/.gradle/
/android-export/**/build/
